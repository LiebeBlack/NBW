name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # SSE4.2 (CRC32 hardware hashing). panic stays "unwind" (see Cargo.toml):
  # the Zero-Crash Engine needs catch_unwind to contain faults.
  RUSTFLAGS: "-C target-feature=+sse4.2"

jobs:
  test:
    name: Unit tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Cargo.lock is generated on the first build (it is not committed),
          # so hashFiles('**/Cargo.lock') is empty on a cold checkout and the
          # primary key collapses onto the restore-key prefix — which is what
          # logged "Cache not found for input keys: Windows-cargo-test-,
          # Windows-cargo-test-". Falling back to Cargo.toml always yields a
          # non-empty, distinct key while keeping the same restore prefix.
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run unit tests
        run: cargo test --release --all-features -- --nocapture

  build-installer:
    name: Build installer (windows-latest)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Same cold-checkout fallback as the test job above.
          key: ${{ runner.os }}-cargo-rel-${{ hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rel-

      - name: Build release binary (SSE4.2, LTO, stripped)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Inspect binary size
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/freeweb.exe"
          if (-not (Test-Path $exe)) { throw "binary missing: $exe" }
          $kb = [math]::Round((Get-Item $exe).Length / 1KB, 1)
          Write-Host "freeweb.exe size: $kb KB"

      - name: Prepare staging directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/staging | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/freeweb.exe installer/staging/FreeWeb.exe

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # 2026-03-02: the official download links moved to immutable GitHub
          # releases, so files.jrsoftware.org/is/6/innosetup-6.3.3.exe now
          # returns 404. This release is immutable and its SHA-256 is taken
          # from the release metadata, so the installer is verified before it
          # is executed.
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $sha256 = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          $out = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          $actual = (Get-FileHash -Path $out -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $sha256) {
            throw "Inno Setup checksum mismatch: expected $sha256, got $actual"
          }
          Start-Process -FilePath $out `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          Write-Host "Inno Setup 6.7.3 installed."

      - name: Compile installer
        shell: pwsh
        run: |
          # Probe every layout the installer may use instead of assuming one,
          # and fail loudly with a clear reason if none is present.
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 7\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found: the Inno Setup install step did not succeed." }
          Write-Host "Using $iscc"
          & $iscc installer/freeweb.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeWeb-2.0.0-installer
          path: installer/Output/FreeWebSetup-2.0.0.exe
          if-no-files-found: error

      - name: Upload portable exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeWeb-2.0.0-portable
          path: installer/staging/FreeWeb.exe
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/FreeWebSetup-2.0.0.exe
            installer/staging/FreeWeb.exe
