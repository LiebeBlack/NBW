[package]
name = "freeweb"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "Ultra-light native Windows browser: own HTML5/CSS3 renderer, Schannel TLS 1.2/1.3 client, SSE4.2 adblock, core-pinned threads, PDH thermal governor. No WebView2, no Chromium, no CEF, no Electron."
license = "MIT"
default-run = "freeweb"

[[bin]]
name = "freeweb"
path = "src/main.rs"

# ---------------------------------------------------------------------------
# Dependencies: winit is the windowing layer; Boa is the sandboxed ECMAScript
# runtime used for page scripts. The HTTP backend remains std-only.
# The Win32 backend and rwh_06 are winit defaults on Windows; explicit
# features here pin them so a stripped default-features build stays honest.
# Window surface, HTTP, TLS, HTML, CSS, text shaping and font bitmaps are
# implemented natively in this repository.
# ---------------------------------------------------------------------------
[dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }
boa_engine = "0.20"

# ---------------------------------------------------------------------------
# Release profile: fat LTO, one codegen unit, stripped symbols.
# NOTE: panics must remain unwindable so the Zero-Crash Engine
# (std::panic::catch_unwind) can contain faults; the process never aborts.
# ---------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false
rpath = false

[profile.release.package."*"]
opt-level = 3
